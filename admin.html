<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:: Painel Admin - Planilha Windows 98 ::</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-win98">

    <div class="window-frame">
        <div class="titlebar">
            <span>[ADMIN] Editor_de_Inventario_Win98.xls</span>
            <a href="index.html" style="color:white; text-decoration:none; font-weight:bold;">[ X ]</a>
        </div>
        <div class="content-area">

            <header style="margin-bottom: 10px;">
                <h1 style="font-size: 32px;">PAINEL DE INVENTÁRIO (PLANILHA)</h1>
                <div class="controls">
                    <a href="index.html" class="btn-retro">⬅️ Voltar ao Catálogo</a>
                    <button class="btn-retro" style="background:#28a745; color:white;" onclick="salvarTudo()">💾 SALVAR ALTERAÇÕES</button>
                </div>
            </header>

            <!-- Barra de Ferramentas -->
            <div class="admin-toolbar">
                <label><strong>🔍 Buscar:</strong></label>
                <input type="text" id="admin-search" placeholder="Filtrar por nome, descrição, arquivo..." oninput="onFilterChange()" style="width: 250px;">

                <label style="margin-left: 10px;"><strong>📂 Categoria:</strong></label>
                <select id="admin-cat-filter" onchange="onFilterChange()" style="min-width: 150px;">
                    <option value="">Todas as Categorias</option>
                </select>

                <span id="admin-count-info" style="margin-left: auto; font-size: 11px; font-weight: bold;">Carregando...</span>
            </div>

            <!-- Tabela com Cabeçalhos Redimensionáveis -->
            <div class="admin-table-container">
                <table class="win98-table" id="inventory-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;">Linha</th>
                            <th style="width: 100px;">Status</th>
                            <th style="width: 140px;">Categoria</th>
                            <th style="width: 200px;">Nome do Item</th>
                            <th style="width: 260px;">Descrição</th>
                            <th style="width: 80px;">Preço</th>
                            <th style="width: 200px;">Links das Fotos</th>
                            <th style="width: 140px;">Arquivo</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 20px;">Carregando dados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" id="admin-pagination"></div>

            <div style="text-align: right; margin-top: 15px;">
                <button class="btn-retro" style="background:#28a745; color:white; padding: 10px 20px; font-size: 14px;" onclick="salvarTudo()">
                    💾 SALVAR TODAS AS ALTERAÇÕES NA PLANILHA
                </button>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwv8m5xK7gjdRR6ZWyxqUBrz0fYYLn0pBvTbAjweUuDQl5y7qfk0vZltXQEgTLFUi-unA/exec";
        
        let rawItems = [];
        let filteredItems = [];
        let currentPage = 1;
        const PAGE_SIZE = 20;

        window.onload = function() {
            enableColumnResizing();
            fetch(API_URL + "?action=getData")
                .then(r => r.json())
                .then(items => {
                    rawItems = items;
                    populateCategoryDropdown(items);
                    onFilterChange();
                })
                .catch(() => {
                    document.getElementById('table-body').innerHTML = '<tr><td colspan="8" style="color:red; text-align:center;">Erro ao carregar dados da planilha.</td></tr>';
                });
        };

        // Redimensionamento Horizontal das Colunas da Tabela
        function enableColumnResizing() {
            const ths = document.querySelectorAll('#inventory-table th');
            ths.forEach(th => {
                const resizer = document.createElement('div');
                resizer.classList.add('resizer');
                th.appendChild(resizer);

                let startX, startWidth;

                resizer.addEventListener('mousedown', (e) => {
                    startX = e.pageX;
                    startWidth = th.offsetWidth;
                    resizer.classList.add('resizing');

                    function onMouseMove(e) {
                        const newWidth = startWidth + (e.pageX - startX);
                        if (newWidth > 35) {
                            th.style.width = newWidth + 'px';
                        }
                    }

                    function onMouseUp() {
                        resizer.classList.remove('resizing');
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    }

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });
            });
        }

        function populateCategoryDropdown(items) {
            const select = document.getElementById('admin-cat-filter');
            const cats = [...new Set(items.map(i => i.categoria || 'Geral'))].sort();
            cats.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.innerText = c;
                select.appendChild(opt);
            });
        }

        function onFilterChange() {
            saveCurrentPageEditsToMemory();

            const term = document.getElementById('admin-search').value.toLowerCase().trim();
            const cat = document.getElementById('admin-cat-filter').value;

            filteredItems = rawItems.filter(item => {
                const matchCat = !cat || (item.categoria || 'Geral') === cat;
                const matchTerm = !term || 
                    String(item.nome || '').toLowerCase().includes(term) ||
                    String(item.descricao || '').toLowerCase().includes(term) ||
                    String(item.arquivo || '').toLowerCase().includes(term) ||
                    String(item.rowIndex).includes(term);
                return matchCat && matchTerm;
            });

            currentPage = 1;
            renderAdminTable();
        }

        function saveCurrentPageEditsToMemory() {
            const rows = document.querySelectorAll('#table-body tr');
            rows.forEach(tr => {
                const rIndex = Number(tr.dataset.rowindex);
                if (!rIndex) return;

                const item = rawItems.find(i => i.rowIndex === rIndex);
                if (item) {
                    item.status = tr.querySelector('.f-status').value;
                    item.categoria = tr.querySelector('.f-cat').value;
                    item.nome = tr.querySelector('.f-nome').value;
                    item.descricao = tr.querySelector('.f-desc').value;
                    item.preco = tr.querySelector('.f-preco').value;
                    item.linkRaw = tr.querySelector('.f-link').value;
                    item.arquivo = tr.querySelector('.f-arq').value;
                }
            });
        }

        function updateStatusColor(select) {
            // Disponível = Preto (#000000), Vendido = Verde (#008000)
            select.style.color = select.value === 'VENDIDO' ? '#008000' : '#000000';
        }

        function renderAdminTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const total = filteredItems.length;
            document.getElementById('admin-count-info').innerText = `Total: ${total} item(ns)`;

            if (total === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:15px;">Nenhum item correspondente ao filtro.</td></tr>';
                document.getElementById('admin-pagination').innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const pageItems = filteredItems.slice(start, end);

            pageItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.dataset.rowindex = item.rowIndex;

                const isVendido = item.status === 'VENDIDO';
                const statusColor = isVendido ? '#008000' : '#000000';

                tr.innerHTML = `
                    <td style="text-align: center; font-weight: bold; background: #e8e8e8;">${item.rowIndex}</td>
                    <td>
                        <select class="f-status" onchange="updateStatusColor(this)" style="font-weight:bold; color: ${statusColor};">
                            <option value="" ${!isVendido ? 'selected' : ''}>Disponível</option>
                            <option value="VENDIDO" ${isVendido ? 'selected' : ''}>VENDIDO</option>
                        </select>
                    </td>
                    <td><input type="text" class="f-cat" value="${escapeHtml(item.categoria || '')}"></td>
                    <td><input type="text" class="f-nome" value="${escapeHtml(item.nome || '')}"></td>
                    <td><textarea class="f-desc" rows="2">${escapeHtml(item.descricao || '')}</textarea></td>
                    <td><input type="number" step="0.01" class="f-preco" value="${item.preco || 0}"></td>
                    <td><input type="text" class="f-link" value="${escapeHtml(item.linkRaw || '')}" title="Links separados por vírgula ou barra"></td>
                    <td><input type="text" class="f-arq" value="${escapeHtml(item.arquivo || '')}"></td>
                `;
                tbody.appendChild(tr);
            });

            renderAdminPagination(totalPages);
        }

        function renderAdminPagination(totalPages) {
            const container = document.getElementById('admin-pagination');
            container.innerHTML = '';
            if (totalPages <= 1) return;

            for (let p = 1; p <= totalPages; p++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${p === currentPage ? 'active' : ''}`;
                btn.innerText = p;
                btn.onclick = () => {
                    saveCurrentPageEditsToMemory();
                    currentPage = p;
                    renderAdminTable();
                };
                container.appendChild(btn);
            }
        }

        function escapeHtml(text) {
            return String(text).replace(/"/g, '&quot;');
        }

        function salvarTudo() {
            saveCurrentPageEditsToMemory();

            const pass = prompt("🔐 Digite a senha administrativa (senha_admin):");
            if (!pass) return;

            const payload = {
                password: pass,
                items: rawItems
            };

            const btns = document.querySelectorAll('button');
            btns.forEach(b => b.disabled = true);

            fetch(API_URL + "?action=saveBatch", {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                btns.forEach(b => b.disabled = false);
                if (res.success) {
                    alert("✓ " + res.message);
                    location.reload();
                } else {
                    alert("❌ " + res.message);
                }
            })
            .catch(() => {
                btns.forEach(b => b.disabled = false);
                alert("Erro ao comunicar com a planilha Google.");
            });
        }
    </script>
</body>
</html>

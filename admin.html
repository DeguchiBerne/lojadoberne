<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Loja do Berne</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --sold-overlay: rgba(239, 68, 68, 0.85);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px auto;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        h1 { margin: 0; color: #0f172a; font-size: 24px; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-4px); }
        .image-container {
            width: 100%;
            height: 220px;
            background: #e2e8f0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Marca d'água de VENDIDO com transparência */
        .sold-badge {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--sold-overlay);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            transform: rotate(-15deg);
            z-index: 5;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .category {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #1e293b;
        }
        .description {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 12px;
            flex-grow: 1;
        }
        .footer-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid #f1f5f9;
            padding-top: 10px;
        }
        .price {
            font-size: 18px;
            font-weight: bold;
            color: #059669;
        }
        .admin-btn {
            background-color: #475569;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        .admin-btn:hover { background-color: #334155; }
        
        /* Modal de Senha Administrativa */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-content input {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-confirm { background: var(--primary); color: white; }
        .btn-cancel { background: #e2e8f0; color: #475569; }
    </style>
</head>
<body>

    <header>
        <h1>Catálogo de Anúncios - Loja do Berne</h1>
        <div style="font-size: 14px; color: #64748b;">Painel com Acesso Administrativo Restrito</div>
    </header>

    <div class="container" id="catalog-grid">
        <p style="text-align: center; grid-column: 1 / -1;">Carregando anúncios...</p>
    </div>

    <!-- Modal de Senha -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3>Acesso Administrativo</h3>
            <p style="font-size: 13px; color: #64748b;">Digite a senha para alterar o status do item:</p>
            <input type="password" id="adminPassword" placeholder="Senha administrativa">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-confirm" onclick="submitAdminAction()">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        let selectedRowIndex = null;

        window.onload = function() {
            loadCatalog();
        };

        function loadCatalog() {
            google.script.run
                .withSuccessHandler(renderCatalog)
                .withFailureHandler(function(err) {
                    document.getElementById('catalog-grid').innerHTML = '<p style="color:red; text-align:center;">Erro ao carregar os dados.</p>';
                })
                .getCatalogData();
        }

        function renderCatalog(items) {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">Nenhum item encontrado na planilha.</p>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                let imgUrl = (item.links && item.links.length > 0) ? item.links[0] : 'https://via.placeholder.com/280x220?text=Sem+Foto';
                
                let soldOverlayHTML = item.vendido ? '<div class="sold-badge">Vendido</div>' : '';

                card.innerHTML = `
                    <div class="image-container">
                        ${soldOverlayHTML}
                        <img src="${imgUrl}" alt="${item.nome}" loading="lazy" onerror="this.src='https://via.placeholder.com/280x220?text=Erro+Foto'">
                    </div>
                    <div class="card-content">
                        <div>
                            <div class="category">${item.categoria || 'Geral'}</div>
                            <h2 class="title">${item.nome}</h2>
                            <div class="description">${item.descricao || 'Sem descrição.'}</div>
                        </div>
                        <div class="footer-card">
                            <div class="price">R$ ${item.preco ? Number(item.preco).toFixed(2).replace('.', ',') : '0,00'}</div>
                            <button class="admin-btn" onclick="openAdminModal(${item.rowIndex})">
                                ${item.vendido ? 'Desfazer Venda' : 'Marcar Vendido'}
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openAdminModal(rowIndex) {
            selectedRowIndex = rowIndex;
            document.getElementById('adminPassword').value = '';
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('adminPassword').focus();
        }

        function closeModal() {
            document.getElementById('adminModal').style.display = 'none';
            selectedRowIndex = null;
        }

        function submitAdminAction() {
            const password = document.getElementById('adminPassword').value;
            if (!password) {
                alert('Por favor, digite a senha.');
                return;
            }

            google.script.run
                .withSuccessHandler(function(response) {
                    if (response.success) {
                        closeModal();
                        loadCatalog(); // Recarrega os anúncios atualizados
                    } else {
                        alert(response.message);
                    }
                })
                .withFailureHandler(function(err) {
                    alert('Erro na comunicação com o servidor.');
                })
                .toggleVendidoAdmin(selectedRowIndex, password);
        }
    </script>
</body>
</html>

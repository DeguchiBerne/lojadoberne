<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:: Loja do Berne - Catálogo Arcade 90s ::</title>
    <style>
        /* --- TEMA PADRÃO: ANOS 90 ESCURO COM NEONS BRILHANTES --- */
        :root {
            --bg-main: #0b0b16;
            --panel-bg: #15152b;
            --text-color: #00ffcc;
            --accent-pink: #ff007f;
            --accent-yellow: #ffee00;
            --border-neon: #00ffff;
            --card-bg: #1e1e3f;
            font-family: "Courier New", Courier, monospace;
        }

        /* --- TEMA ALTERNATIVO: CLÁSSICO RETRÔ 2000 (WINDOWS 98) --- */
        body.theme-win98 {
            --bg-main: #008080;
            --panel-bg: #c0c0c0;
            --text-color: #000000;
            --accent-pink: #800000;
            --accent-yellow: #ffff00;
            --border-neon: #080808;
            --card-bg: #f1f1f1;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: body.theme-win98 ? none : radial-gradient(#1c1c3c 15%, transparent 16%);
            background-size: 20px 20px;
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            transition: background 0.3s ease;
        }

        /* Contêiner Geral */
        .arcade-container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--panel-bg);
            border: 4px solid var(--border-neon);
            box-shadow: 0 0 20px var(--border-neon);
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed var(--text-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            text-transform: uppercase;
            text-shadow: 2px 2px var(--accent-pink);
            letter-spacing: 2px;
        }

        .controls-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-retro {
            background: var(--accent-pink);
            color: #fff;
            border: 2px solid var(--text-color);
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 12px;
            box-shadow: 2px 2px 0px var(--text-color);
        }
        .btn-retro:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .visitor-counter {
            background: #000;
            color: var(--accent-yellow);
            padding: 4px 8px;
            border: 1px solid var(--text-color);
            font-size: 12px;
            font-weight: bold;
        }

        /* Painel Guia / Filtro de Categorias */
        .category-guide {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border: 1px solid var(--text-color);
            margin-bottom: 20px;
        }
        .cat-tab {
            background: #222;
            color: var(--accent-yellow);
            border: 1px solid var(--text-color);
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .cat-tab.active, .cat-tab:hover {
            background: var(--text-color);
            color: #000;
        }

        .section-title {
            font-size: 18px;
            color: var(--accent-yellow);
            border-bottom: 1px solid var(--text-color);
            margin: 20px 0 10px 0;
            padding-bottom: 5px;
            text-transform: uppercase;
        }

        /* Grid de Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-neon);
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.5);
        }

        .image-container {
            width: 100%;
            height: 180px;
            background: #000;
            border: 2px inset var(--text-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sold-badge {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 0, 0, 0.8);
            color: yellow;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            font-family: "Impact", sans-serif;
            letter-spacing: 3px;
            transform: rotate(-15deg);
            z-index: 5;
            pointer-events: none;
            text-shadow: 2px 2px #000;
        }

        .card-content {
            padding: 8px 0;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .category-tag {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            color: var(--accent-yellow);
            background: #000;
            padding: 2px 4px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .title {
            font-size: 14px;
            font-weight: bold;
            margin: 5px 0;
            color: var(--text-color);
        }

        .description {
            font-size: 11px;
            color: #ccc;
            margin-bottom: 10px;
            flex-grow: 1;
        }

        .footer-card {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px dotted var(--text-color);
            padding-top: 6px;
        }

        .price {
            font-size: 15px;
            font-weight: bold;
            color: #00ff66;
        }

        .add-cart-btn {
            background-color: var(--accent-yellow);
            color: #000;
            border: 2px solid var(--text-color);
            padding: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .add-cart-btn:hover { background-color: #fff; }
        .add-cart-btn.added { background-color: #00ff66; color: #000; }
        .add-cart-btn.disabled { background-color: #555; color: #888; cursor: not-allowed; pointer-events: none; }

        /* --- CARRINHO FLUTUANTE FIXO --- */
        .floating-cart {
            position: fixed;
            bottom: 0;
            right: 20px;
            width: 320px;
            background: var(--panel-bg);
            border: 3px solid var(--border-neon);
            box-shadow: 0 0 15px var(--border-neon);
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
        }
        .floating-cart.minimized {
            transform: translateY(calc(100% - 35px));
        }
        .fc-header {
            background: var(--accent-pink);
            color: #fff;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .fc-body {
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            background: #fff;
            color: #000;
            font-size: 11px;
        }
        .fc-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #ccc;
            padding: 3px 0;
        }
        .fc-footer {
            padding: 10px;
            background: var(--panel-bg);
            color: var(--text-color);
            border-top: 1px solid var(--border-neon);
            text-align: center;
        }
        .whatsapp-send-btn {
            background: #25d366;
            color: #fff;
            border: 2px solid #fff;
            padding: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            font-size: 12px;
        }
        .whatsapp-send-btn:hover { background: #20ba5a; }
    </style>
</head>
<body>

    <div class="arcade-container">
        <div class="top-bar">
            <h1>🕹️ LOJA DO BERNE - ARCADE 90S</h1>
            <div class="controls-group">
                <div class="visitor-counter" id="visitor-count">VISITAS: 000142</div>
                <button class="btn-retro" onclick="toggleTheme()">Mudar Tema (90s / 2000)</button>
                <a href="admin.html" class="btn-retro">Admin</a>
            </div>
        </div>

        <!-- Painel Guia de Categorias -->
        <div class="category-guide" id="category-guide">
            <span class="cat-tab active" onclick="filterCategory('TODOS')">[ TODOS OS ITENS ]</span>
            <!-- Categorias geradas via script -->
        </div>

        <!-- Seção de Destaques Aleatórios da Tela Inicial -->
        <div id="home-featured-section">
            <div class="section-title">⭐ Destaques Aleatórios por Categoria</div>
            <div class="grid" id="featured-grid">
                <!-- Gerado via script -->
            </div>
        </div>

        <!-- Seção de Listagem Principal / Filtrada -->
        <div class="section-title" id="main-catalog-title">📦 Catálogo Completo</div>
        <div class="grid" id="catalog-grid">
            <p style="grid-column: 1 / -1; text-align: center;">Carregando banco de dados...</p>
        </div>
    </div>

    <!-- Carrinho Flutuante -->
    <div class="floating-cart minimized" id="floating-cart">
        <div class="fc-header" onclick="toggleCartMinimize()">
            <span id="fc-title">🛒 Carrinho (0 itens - R$ 0,00)</span>
            <span id="fc-toggle-icon">▲ Subir</span>
        </div>
        <div class="fc-body" id="fc-items-list">
            <div style="text-align: center; color: #777;">Carrinho vazio.</div>
        </div>
        <div class="fc-footer">
            <div style="font-weight: bold; margin-bottom: 5px;">Total: <span id="fc-total">R$ 0,00</span></div>
            <button class="whatsapp-send-btn" onclick="enviarCarrinhoWhatsApp()">💬 Enviar Carrinho para o WhatsApp</button>
        </div>
    </div>

    <script>
        const API_URL = "SUA_URL_DO_WEB_APP_AQUI";
        const WHATSAPP_NUMBER = "5541999999999"; // Substitua pelo seu número com DDI e DDD

        let allProducts = [];
        let cart = [];
        let currentCategory = 'TODOS';
        let isCartMinimized = true;

        window.onload = function() {
            // Contador de visitas simulado/persistente
            let visitas = localStorage.getItem('berne_visitas') || 142;
            if (!sessionStorage.getItem('visited')) {
                visitas++;
                localStorage.setItem('berne_visitas', visitas);
                sessionStorage.setItem('visited', 'true');
            }
            document.getElementById('visitor-count').innerText = "VISITAS: " + String(visitas).padStart(6, '0');

            // Carrega os dados da API
            fetch(API_URL + "?action=getData")
                .then(response => response.json())
                .then(items => {
                    allProducts = items;
                    initApp(items);
                })
                .catch(err => {
                    document.getElementById('catalog-grid').innerHTML = '<p style="color:red; text-align:center;">Erro ao conectar com o servidor.</p>';
                });
        };

        function initApp(items) {
            buildCategoryGuide(items);
            renderFeaturedItems(items);
            renderCatalog(items);
        }

        function buildCategoryGuide(items) {
            const guide = document.getElementById('category-guide');
            const categories = [...new Set(items.map(i => i.categoria || 'Geral'))];

            categories.forEach(cat => {
                const tab = document.createElement('span');
                tab.className = 'cat-tab';
                tab.innerText = `[ ${cat.toUpperCase()} ]`;
                tab.onclick = () => filterCategory(cat);
                guide.appendChild(tab);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            
            // Atualiza abas ativas
            document.querySelectorAll('.cat-tab').forEach(t => {
                t.classList.toggle('active', t.innerText.includes(cat) || (cat === 'TODOS' && t.innerText.includes('TODOS')));
            });

            const featuredSection = document.getElementById('home-featured-section');
            const mainTitle = document.getElementById('main-catalog-title');

            if (cat === 'TODOS') {
                featuredSection.style.display = 'block';
                mainTitle.innerText = "📦 Catálogo Completo";
                renderCatalog(allProducts);
            } else {
                featuredSection.style.display = 'none';
                mainTitle.innerText = `📦 Categoria: ${cat}`;
                const filtered = allProducts.filter(i => (i.categoria || 'Geral') === cat);
                renderCatalog(filtered);
            }
        }

        function renderFeaturedItems(items) {
            const grid = document.getElementById('featured-grid');
            grid.innerHTML = '';

            const categories = [...new Set(items.map(i => i.categoria || 'Geral'))];

            categories.forEach(cat => {
                const catItems = items.filter(i => (i.categoria || 'Geral') === cat && !i.vendido);
                if (catItems.length === 0) return;

                // Seleciona um item aleatório da categoria
                const randomItem = catItems[Math.floor(Math.random() * catItems.length)];
                grid.appendChild(createCardElement(randomItem));
            });
        }

        function renderCatalog(items) {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">Nenhum item encontrado.</p>';
                return;
            }

            items.forEach(item => {
                grid.appendChild(createCardElement(item));
            });
        }

        function createCardElement(item) {
            const card = document.createElement('div');
            card.className = 'card';

            let imgUrl = (item.links && item.links.length > 0) ? item.links[0] : 'https://via.placeholder.com/240x180?text=Sem+Foto';
            let soldOverlayHTML = item.vendido ? '<div class="sold-badge">VENDIDO</div>' : '';
            let precoFormatado = item.preco ? Number(item.preco).toFixed(2).replace('.', ',') : '0,00';

            let inCart = cart.some(cartItem => cartItem.rowIndex === item.rowIndex);

            let btnHtml = '';
            if (item.vendido) {
                btnHtml = `<button class="add-cart-btn disabled" disabled>Indisponível</button>`;
            } else if (inCart) {
                btnHtml = `<button class="add-cart-btn added" onclick="toggleCart(${item.rowIndex})">✓ No Carrinho</button>`;
            } else {
                btnHtml = `<button class="add-cart-btn" onclick="toggleCart(${item.rowIndex})">🛒 Adicionar ao Carrinho</button>`;
            }

            card.innerHTML = `
                <div class="image-container">
                    ${soldOverlayHTML}
                    <img src="${imgUrl}" alt="${item.nome}" loading="lazy" onerror="this.src='https://via.placeholder.com/240x180?text=Erro+Foto'">
                </div>
                <div class="card-content">
                    <div>
                        <span class="category-tag">${item.categoria || 'Geral'}</span>
                        <div class="title">${item.nome}</div>
                        <div class="description">${item.descricao || 'Sem descrição.'}</div>
                    </div>
                    <div class="footer-card">
                        <div class="price">R$ ${precoFormatado}</div>
                        ${btnHtml}
                    </div>
                </div>
            `;
            return card;
        }

        function toggleCart(rowIndex) {
            const itemIndex = cart.findIndex(i => i.rowIndex === rowIndex);
            
            if (itemIndex > -1) {
                cart.splice(itemIndex, 1);
            } else {
                const product = allProducts.find(p => p.rowIndex === rowIndex);
                if (product && !product.vendido) {
                    cart.push(product);
                }
            }

            if (currentCategory === 'TODOS') {
                renderFeaturedItems(allProducts);
                renderCatalog(allProducts);
            } else {
                const filtered = allProducts.filter(i => (i.categoria || 'Geral') === currentCategory);
                renderCatalog(filtered);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('fc-items-list');
            const titleEl = document.getElementById('fc-title');
            const totalEl = document.getElementById('fc-total');

            let totalVal = 0;
            cart.forEach(item => { totalVal += Number(item.preco || 0); });

            titleEl.innerText = `🛒 Carrinho (${cart.length} itens - R$ ${totalVal.toFixed(2).replace('.', ',')})`;
            totalEl.innerText = `R$ ${totalVal.toFixed(2).replace('.', ',')}`;

            if (cart.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #777;">Carrinho vazio.</div>`;
                return;
            }

            let html = '';
            cart.forEach(item => {
                let precoFmt = Number(item.preco || 0).toFixed(2).replace('.', ',');
                html += `
                    <div class="fc-item">
                        <span>• ${item.nome}</span>
                        <span style="font-weight:bold;">R$ ${precoFmt}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function toggleCartMinimize() {
            const cartEl = document.getElementById('floating-cart');
            const iconEl = document.getElementById('fc-toggle-icon');
            
            isCartMinimized = !isCartMinimized;
            if (isCartMinimized) {
                cartEl.classList.add('minimized');
                iconEl.innerText = "▲ Subir";
            } else {
                cartEl.classList.remove('minimized');
                iconEl.innerText = "▼ Descer";
            }
        }

        function enviarCarrinhoWhatsApp() {
            if (cart.length === 0) return;

            let total = 0;
            let mensagem = "Olá! Gostaria de fechar o pedido com os seguintes itens do carrinho:\n\n";

            cart.forEach((item, index) => {
                let precoNum = Number(item.preco || 0);
                total += precoNum;
                mensagem += `${index + 1}. *${item.nome}* - R$ ${precoNum.toFixed(2).replace('.', ',')}\n`;
            });

            mensagem += `\n*Quantidade Total:* ${cart.length} item(ns)\n*Valor Total:* R$ ${total.toFixed(2).replace('.', ',')}\n\nPode confirmar a disponibilidade?`;

            let encodedMsg = encodeURIComponent(mensagem);
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMsg}`, '_blank');
        }

        function toggleTheme() {
            document.body.classList.toggle('theme-win98');
        }
    </script>
</body>
</html>
